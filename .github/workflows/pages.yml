name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build simulator asset bundle
        run: python tools/build_simulator_bundle.py
      - name: Prepare public site
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/pages-site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='content/backups/' \
            --exclude='editor/' \
            --exclude='tools/' \
            --exclude='output/' \
            --exclude='tmp/' \
            --exclude='start-editor.cmd' \
            --exclude='publish-update.cmd' \
            --exclude='README.md' \
            --exclude='DESIGN_GUIDE.md' \
            --exclude='EDITOR_GUIDE.md' \
            ./ "${RUNNER_TEMP}/pages-site/"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
